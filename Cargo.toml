[package]
name = "postgres-cdc"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { git = "https://github.com/iambriccardo/rust-postgres.git", branch = "master" }
postgres-replication = { git = "https://github.com/iambriccardo/rust-postgres.git", branch = "master" }
futures-util = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
native-tls = "0.2"
postgres-native-tls = { git = "https://github.com/iambriccardo/rust-postgres.git", branch = "master" }

[dev-dependencies]
rstest = "0.27.0"
